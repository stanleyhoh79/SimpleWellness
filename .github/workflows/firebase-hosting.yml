name: Build and deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-main
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Prepare static admin route
        run: mkdir -p dist/client/admin && cp dist/client/admin.html dist/client/admin/index.html

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/476819662665/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-firebase-hosting@simplewellnessv1.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting,firestore:rules,storage --project simplewellnessv1 --non-interactive
